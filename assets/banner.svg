<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Yang Yaqing — Translator x Coder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="55%" stop-color="#8B7CFF"/>
      <stop offset="100%" stop-color="#4ECDC4"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#shade)"/>

  <g fill="#ffffff" opacity="0.10">
    <circle cx="1040" cy="50" r="130"/>
    <circle cx="1130" cy="240" r="86"/>
    <circle cx="930" cy="252" r="38"/>
    <circle cx="860" cy="24" r="20"/>
  </g>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" fill="#ffffff">
    <text x="80" y="122" font-size="62" font-weight="700" letter-spacing="-1">Yang Yaqing</text>
    <text x="82" y="168" font-size="24" opacity="0.92">Translator &#215; Coder — building AI-assisted translation tools</text>
    <text x="82" y="214" font-size="18" opacity="0.72">Hebei Normal University &#8594; University of Stirling &#183; 2026</text>
  </g>

  <g transform="translate(80,240)" fill="#ffffff" opacity="0.85">
    <rect width="46" height="5" rx="2.5" fill="#ffffff" opacity="0.9"/>
    <rect x="56" width="18" height="5" rx="2.5" fill="#ffffff" opacity="0.45"/>
  </g>
</svg>
