<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Education: 2023 Hebei Normal University, 2026 University of Stirling, 2027 graduation">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f9ff"/>
      <stop offset="100%" stop-color="#eef7f6"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6C63FF" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#8B7CFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4ECDC4" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="248" rx="18" fill="url(#card)" stroke="#e4e7f2" stroke-width="1"/>

  <line x1="170" y1="118" x2="1030" y2="118" stroke="#e0e4f0" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 10"/>
  <line x1="170" y1="118" x2="1030" y2="118" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 10"/>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <g>
      <text x="250" y="86" font-size="19" font-weight="700" fill="#6C63FF">2023</text>
      <circle cx="250" cy="118" r="9" fill="#6C63FF"/>
      <circle cx="250" cy="118" r="9" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
      <text x="250" y="160" font-size="19" font-weight="600" fill="#1f2333">Hebei Normal University</text>
      <text x="250" y="186" font-size="15" fill="#6b7086">Translation &#183; years 1–3</text>
    </g>
    <g>
      <text x="600" y="86" font-size="19" font-weight="700" fill="#8B7CFF">2026</text>
      <circle cx="600" cy="118" r="9" fill="#8B7CFF"/>
      <circle cx="600" cy="118" r="9" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
      <text x="600" y="160" font-size="19" font-weight="600" fill="#1f2333">University of Stirling</text>
      <text x="600" y="186" font-size="15" fill="#6b7086">Final year &#183; joint programme</text>
    </g>
    <g>
      <text x="950" y="86" font-size="19" font-weight="700" fill="#3CBFAE">2027</text>
      <circle cx="950" cy="118" r="9" fill="#4ECDC4"/>
      <circle cx="950" cy="118" r="9" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
      <text x="950" y="160" font-size="19" font-weight="600" fill="#1f2333">Graduation</text>
      <text x="950" y="186" font-size="15" fill="#6b7086">4-year joint programme</text>
    </g>
  </g>
</svg>
